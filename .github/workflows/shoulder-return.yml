name: Shoulder harness return
on:
  push:
    paths:
      - 'studies/shoulder-return-r84/**'
      - '.github/workflows/shoulder-return.yml'
  pull_request:
    paths:
      - 'studies/shoulder-return-r84/**'
      - '.github/workflows/shoulder-return.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studies/shoulder-return-r84
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verify.py
