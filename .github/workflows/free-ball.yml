name: Free-ball release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-free-ball.txt
      - run: python -m unittest discover -s tests -p test_free_ball.py -v
      - run: python free_ball.py
