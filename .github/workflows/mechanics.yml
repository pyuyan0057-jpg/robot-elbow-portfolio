name: Mechanics and control checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python elbow_control.py
      - run: python check_controls.py
      - run: python grasp_lift.py
